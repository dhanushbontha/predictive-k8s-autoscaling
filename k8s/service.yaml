# k8s/service.yaml
# ClusterIP Service for the workload app.
# Used by the ServiceMonitor for Prometheus scraping and by KEDA triggers later.
apiVersion: v1
kind: Service
metadata:
  name: workload-app
  namespace: workload
  labels:
    app: workload-app
spec:
  selector:
    app: workload-app
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
