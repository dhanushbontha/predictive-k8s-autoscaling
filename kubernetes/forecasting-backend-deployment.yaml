apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecasting-backend
  labels:
    app: forecasting-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forecasting-backend
  template:
    metadata:
      labels:
        app: forecasting-backend
    spec:
      containers:
        - name: forecasting-backend
          image: predictive-forecasting-backend:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: PROMETHEUS_URL
              value: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
            - name: TARGET_SERVICE_NAME
              value: "target-app-service"
            - name: PROMETHEUS_QUERY
              value: 'sum(rate(http_requests_total{job="target-app-service", handler="/api/work"}[1m]))'
            - name: HISTORY_WINDOW_SECONDS
              value: "300"
            - name: QUERY_STEP
              value: "5s"
            - name: FORECAST_HORIZON_STEPS
              value: "15"
            - name: FORECAST_CACHE_TTL_SECONDS
              value: "30"
            - name: PREDICTION_HORIZON_STEPS
              value: "5"
            - name: ENABLE_STATIC_FALLBACK
              value: "true"
            - name: FORECAST_CSV_PATH
              value: "/app/data/forecast_periodic.csv"
            - name: METRICS_CSV_PATH
              value: "/app/data/hpa_periodic.csv"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
