
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: target-app-predictive-scaledobject
  namespace: default
  labels:
    app: target-app
    autoscaling: predictive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: target-app
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 5
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
        scaleDown:
          stabilizationWindowSeconds: 15
  triggers:
    - type: prometheus
      # Metric target type:
      # "AverageValue": Target value is per-pod (target = metricValue / currentReplicas).
      # KEDA generates desired replicas = ceil(predicted_http_work_rps / threshold).
      # If using "Value", the target would be evaluated as a global raw value.
      metricType: AverageValue
      metadata:
        serverAddress: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        metricName: predicted_http_work_rps
        query: max(predicted_http_work_rps) and (max(prediction_timestamp_seconds) > 0) and ((time() - max(prediction_timestamp_seconds)) < 45)
        # PROVISIONAL THRESHOLD:
        # 10 requests per second (RPS) per replica.
        # NOTE: This is a provisional starting threshold based on baseline load observations
        # and has NOT yet been experimentally validated through load testing.
        threshold: "10"
        # Treats empty PromQL results (when predictions are stale >= 45s) as a scaler error,
        # incrementing failure count to activate fallback replicas (2).
        ignoreNullValues: "false"
