server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # SPA fallback — serve index.html for any unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: /api/ → forecasting-backend-service
    location /api/ {
        proxy_pass http://forecasting-backend-service.default.svc.cluster.local:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Reverse proxy: /health → forecasting-backend-service
    location /health {
        proxy_pass http://forecasting-backend-service.default.svc.cluster.local:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    # Reverse proxy: /metrics → forecasting-backend-service
    location /metrics {
        proxy_pass http://forecasting-backend-service.default.svc.cluster.local:8080/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
